coinflip-item:
  material: PLAYER_HEAD
  amount: 1
  name: "{theme}{player}'s Coinflip"
  lore:
    - "{white}Bet: {theme}${amount}"
    - "{white}Click to join"
  custom-model-data: 0
  glow: false
  item-flags: []

empty-item:
  slot: 31
  material: BARRIER
  amount: 1
  name: "{muted}No active coinflips"
  lore:
    - "{white}Create one with the emerald below"
  glow: false
  item-flags: []

items:
  filler:
    material: GRAY_STAINED_GLASS_PANE
    amount: 1
    name: " "
    lore: []
    glow: false
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  previous:
    slot: 45
    material: ARROW
    amount: 1
    name: "{theme}Previous Page"
    lore:
      - "{white}Click to go back"
    glow: false
    item-flags: []

  next:
    slot: 53
    material: ARROW
    amount: 1
    name: "{theme}Next Page"
    lore:
      - "{white}Click to continue"
    glow: false
    item-flags: []

  create:
    slot: 48
    material: EMERALD
    amount: 1
    name: "{theme}Create Coinflip"
    lore:
      - "{white}Click to view command usage"
      - "{white}Use /cf create <amount>"
    glow: false
    item-flags: []

  stats:
    slot: 49
    material: BOOK
    amount: 1
    name: "{theme}Your Stats"
    lore:
      - "{white}Total Won: {good}${won}"
      - "{white}Total Lost: {bad}${lost}"
      - "{white}Total Sum: {theme}${sum}"
    glow: false
    item-flags: []

  close:
    slot: 50
    material: BARRIER
    amount: 1
    name: "{bad}Close"
    lore:
      - "{white}Click to close"
    glow: false
    item-flags: []
