# Public coinflip browser GUI.
# Slots are 0-based inventory slots.
title: "&8ᴄᴏɪɴꜰʟɪᴘ"
rows: 6

# Generated coinflip entries render in these slots.
content-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34

navigation:
  # FoPluginCore owns the previous/next item appearance; these slots are configurable.
  previous-slot: 45
  next-slot: 53

coinflip-item:
  material: PLAYER_HEAD
  amount: 1
  name: "{theme}{player}'s Coinflip"
  lore:
    - "{white}Bet: {theme}${amount}"
    - "{white}Click to join"
  custom-model-data: 0
  glow: false
  item-flags: []

items:
  filler:
    material: GRAY_STAINED_GLASS_PANE
    amount: 1
    name: " "
    lore: []
    glow: false
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  entry-filler:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    amount: 1
    name: " "
    lore: []
    glow: false
    item-flags:
      - HIDE_ADDITIONAL_TOOLTIP

  sort:
    slot: 47
    material: COMPARATOR
    amount: 1
    name: ":comparator: {theme}&lSORT"
    # These labels become the FoPluginCore cycle-option lore lines.
    options:
      - value: amount-desc
        label: "Highest Amount"
      - value: amount-asc
        label: "Lowest Amount"
      - value: newest
        label: "Newest First"
      - value: oldest
        label: "Oldest First"
    glow: false
    item-flags: []

  create:
    slot: 48
    material: EMERALD
    amount: 1
    name: ":emerald: {theme}&lCREATE COINFLIP"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fUse {theme}/cf create <amount>"
      - "&7&l | &fCreates a new coinflip."
      - " "
      - "{good}→ Click to Create Coinflip ←"
    glow: false
    item-flags: []

  stats:
    slot: 50
    material: BOOK
    amount: 1
    name: ":book: {theme}&lYOUR STATS"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fTotal Won: {good}${won}"
      - "&7&l | &fTotal Lost: {bad}${lost}"
      - "&7&l | &fTotal Sum: {theme}${sum}"
      - " "
      - "{good}→ Click to View Stats ←"
    glow: false
    item-flags: []

  refresh:
    slot: 49
    material: COMPASS
    amount: 1
    name: ":compass: {theme}&lREFRESH"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fRefreshes the current page."
      - " "
      - "{good}→ Click to Refresh ←"
    glow: false
    item-flags: []
