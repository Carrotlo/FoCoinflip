# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.
# FoCoinflip messages.
tokens:
  prefix: ":gold_nugget: {theme}FoCoinflip &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"

no-permission: "{prefix}{bad}No permission."
player-only: "{prefix}{bad}Player-only command."
usage-main: "{prefix}{muted}Use {white}/coinflip{muted}, {white}/coinflip create <amount>{muted}, or {white}/coinflip delete"
usage-create: "{prefix}{bad}Usage: {white}/coinflip create <amount>"
usage-admin: "{prefix}{bad}Usage: {white}/focoinflipadmin <version|reload|editor>"

invalid-amount: "{prefix}{bad}Amount must be valid."
below-min-bet: "{prefix}{bad}Minimum bet is {theme}${min}{bad}."
above-max-bet: "{prefix}{bad}Maximum bet is {theme}${max}{bad}."
already-has-flip: "{prefix}{bad}You already have an active coinflip."
not-enough-money: "{prefix}{bad}Not enough money."
economy-error: "{prefix}{bad}Economy transaction failed. {muted}Try again."

flip-created: "{prefix}:emerald: {good}Created coinflip for {theme}${amount}{good}."
flip-deleted: "{prefix}:lava_bucket: {good}Deleted coinflip and refunded {theme}${amount}{good}."
no-owned-flip: "{prefix}{bad}No active coinflip to delete."
join-own: "{prefix}{bad}You cannot join your own coinflip."
flip-no-longer-available: "{prefix}{bad}Coinflip no longer available."
flip-win: "{prefix}:emerald: {good}Won against {theme}{opponent}{good}. Payout {theme}${payout}{good}. {muted}Tax {theme}${tax}{muted}."
flip-lose: "{prefix}:redstone: {bad}Lost against {theme}{opponent}{bad}. Lost {theme}${amount}{bad}."
announce: "{prefix}{theme}{winner}{muted} won against {theme}{loser}{muted} for {theme}${payout}{muted}."
stats: "{prefix}{theme}Your Stats {muted}| {good}Won: {theme}${won}{muted}, {bad}Lost: {theme}${lost}{muted}, {good}Net: {theme}${sum}"
create-command-hint: "{prefix}{muted}Create with {theme}/cf create <amount>{muted}, e.g. {white}50k{muted}, {white}1m{muted}, or {white}1Qa"

admin-reload: "{prefix}:emerald: {good}Reloaded config, messages, and public GUIs."
admin-reload-failed: "{prefix}:redstone: {bad}Reload failed at {step}: {error}."
editor-opened: "{prefix}:book: {good}Editor opened."
prompt-cancelled: "{prefix}{bad}Edit cancelled."
prompt-saved: "{prefix}:emerald: {good}Saved setting."
prompt-invalid: "{prefix}:redstone: {bad}{reason}"
setting-updated: "{prefix}{good}Setting updated."
native-dialogs-unavailable: "{prefix}{muted}Native dialogs are not supported on this server, using chat input mode."
